<header>

</header>

<div class="forum-nav">

<!-- 自主汉化弹窗 -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, getDocs, where, doc, updateDoc, arrayUnion, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

    const auth = window.auth;
    const db = window.db;
    const storage = window.storage;

    const postList = document.getElementById('postList');
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const userDisplay = document.getElementById('userDisplay');
    const userAvatarImg = document.getElementById('userAvatarImg');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const userEmailHint = document.getElementById('userEmailHint');
    const authBtn = document.getElementById('authBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const authModal = document.getElementById('authModal');
    const closeAuth = document.getElementById('closeAuth');
    const authTitle = document.getElementById('authTitle');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authNickname = document.getElementById('authNickname');
    const nicknameGroup = document.getElementById('nicknameGroup');
    const submitAuth = document.getElementById('submitAuth');
    const authToggleLink = document.getElementById('authToggleLink');
    const authToggleText = document.getElementById('authToggleText');

    const newPostModal = document.getElementById('newPostModal');
    const closeNewPost = document.getElementById('closeNewPost');
    const postTitle = document.getElementById('postTitle');
    const postCategory = document.getElementById('postCategory');
    const postContent = document.getElementById('postContent');
    const submitPost = document.getElementById('submitPost');

    const fanTranslationModal = document.getElementById('fanTranslationModal');
    const closeFanTranslation = document.getElementById('closeFanTranslation');
    const fanTitle = document.getElementById('fanTitle');
    const fanChapter = document.getElementById('fanChapter');
    const fanContent = document.getElementById('fanContent');
    const fanCategory = document.getElementById('fanCategory');
    const submitFanTranslation = document.getElementById('submitFanTranslation');

    const detailModal = document.getElementById('detailModal');
    const closeDetail = document.getElementById('closeDetail');
    const detailTitle = document.getElementById('detailTitle');
    const detailMeta = document.getElementById('detailMeta');
    const detailContent = document.getElementById('detailContent');
    const replyList = document.getElementById('replyList');
    const replyInput = document.getElementById('replyInput');
    const submitReply = document.getElementById('submitReply');

    const avatarFileInput = document.getElementById('avatarFileInput');
    const stickerImage = document.getElementById('stickerImage');
    const stickerPlaceholder = document.getElementById('stickerPlaceholder');
    const stickerAdminBtn = document.getElementById('stickerAdminBtn');
    const stickerAdminModal = document.getElementById('stickerAdminModal');
    const closeStickerAdmin = document.getElementById('closeStickerAdmin');
    const stickerUrlInput = document.getElementById('stickerUrlInput');
    const stickerFileInput = document.getElementById('stickerFileInput');
    const saveStickerBtn = document.getElementById('saveStickerBtn');

    let currentUser = null;
    let currentUserInfo = null;
    let currentDetailId = null;
    let isLogin = true;

    // ⚠️ 替换成你自己的 Firebase UID（在 Firebase 控制台 Authentication → Users 里复制）
    const OWNER_UID = 'YOUR_UID_HERE';

    function getAvatarChar(nickname) {
        if (!nickname) return '?';
        return nickname.trim().charAt(0).toUpperCase();
    }
    function getAvatarColor(nickname) {
        const colors = ['#e57373','#f06292','#ba68c8','#9575cd','#64b5f6','#4dd0e1','#81c784','#aed581','#ffb74d','#ff8a65'];
        if (!nickname) return colors[0];
        let hash = 0;
        for (let i=0; i<nickname.length; i++) hash = nickname.charCodeAt(i) + ((hash<<5)-hash);
        return colors[Math.abs(hash) % colors.length];
    }

    function updateUserUI(user, userInfo) {
        if (user && userInfo) {
            const nickname = userInfo.nickname || user.email || '用戶';
            const avatarUrl = userInfo.avatarUrl || null;
            userNameDisplay.textContent = nickname;
            userEmailHint.textContent = user.email;
            userEmailHint.style.display = 'inline';
            if (avatarUrl) {
                userAvatarImg.src = avatarUrl;
                userAvatarImg.style.display = 'inline-block';
            } else {
                const char = getAvatarChar(nickname);
                const color = getAvatarColor(nickname);
                userAvatarImg.style.display = 'inline-block';
                userAvatarImg.src = '';
                userAvatarImg.style.background = color;
                userAvatarImg.alt = char;
            }
            authBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            uploadAvatarBtn.style.display = 'inline-block';
        } else {
            userNameDisplay.textContent = '未登入';
            userEmailHint.style.display = 'none';
            userAvatarImg.style.display = 'none';
            authBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            uploadAvatarBtn.style.display = 'none';
        }
    }

    async function renderPosts(filter = '', category = '全部') {
        try {
            let q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
            const snapshot = await getDocs(q);
            let posts = [];
            snapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
            if (category !== '全部') posts = posts.filter(p => p.category === category);
            const keyword = filter.trim().toLowerCase();
            if (keyword) posts = posts.filter(p => p.title.toLowerCase().includes(keyword) || p.content.toLowerCase().includes(keyword));
            if (posts.length === 0) { postList.innerHTML = `<div class="empty-state">📭 沒有符合的帖子</div>`; return; }
            postList.innerHTML = posts.map(p => `
                <div class="post-item" data-id="${p.id}">
                    <h3 class="post-title">${escapeHtml(p.title)}</h3>
                    <div class="post-meta">
                        <span>✍️ ${escapeHtml(p.authorName || '匿名')}</span>
                        <span>🕒 ${p.createdAt ? new Date(p.createdAt.seconds * 1000).toLocaleString('zh-HK') : ''}</span>
                        <span>💬 ${p.replies ? p.replies.length : 0} 則回覆</span>
                        <span>🏷️ ${escapeHtml(p.category || '未分類')}</span>
                    </div>
                    <div class="post-excerpt">${escapeHtml(p.content)}</div>
                </div>
            `).join('');
            document.querySelectorAll('.post-title').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.closest('.post-item').dataset.id;
                    openDetail(id);
                });
            });
        } catch (e) { postList.innerHTML = `<div class="empty-state">⚠️ 讀取失敗</div>`; }
    }
    function escapeHtml(text) { if (!text) return ''; const d=document.createElement('div'); d.textContent=text; return d.innerHTML; }

    async function openDetail(id) {
        try {
            const snapshot = await getDocs(query(collection(db, 'posts')));
            let post = null;
            snapshot.forEach(d => { if (d.id === id) post = { id: d.id, ...d.data() }; });
            if (!post) return;
            currentDetailId = id;
            detailTitle.textContent = post.title;
            detailMeta.textContent = `✍️ ${post.authorName || '匿名'}  ·  🕒 ${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('zh-HK') : ''}  ·  💬 ${post.replies ? post.replies.length : 0} 則回覆`;
            detailContent.textContent = post.content;
            replyList.innerHTML = post.replies && post.replies.length > 0 ? post.replies.map(r => `<div class="reply-item"><strong>${escapeHtml(r.author)}</strong>：${escapeHtml(r.content)}</div>`).join('') : '<div style="color:#9a8e86; padding:8px 0;">還沒有回覆</div>';
            detailModal.classList.add('active');
        } catch(e) { alert('讀取詳情失敗'); }
    }

    submitReply.addEventListener('click', async function() {
        if (!currentUser) return alert('請先登入');
        const text = replyInput.value.trim();
        if (!text) return alert('請寫點內容');
        try {
            const postRef = doc(db, 'posts', currentDetailId);
            await updateDoc(postRef, { replies: arrayUnion({ author: currentUserInfo?.nickname || currentUser.email, content: text, createdAt: new Date() }) });
            replyInput.value = '';
            openDetail(currentDetailId);
            renderPosts(searchInput.value, categorySelect.value);
        } catch(e) { alert('回覆失敗'); }
    });

    submitPost.addEventListener('click', async function() {
        if (!currentUser) return alert('請先登入');
        const title = postTitle.value.trim();
        const content = postContent.value.trim();
        const category = postCategory.value;
        if (!title || !content) return alert('標題和內容都不能空');
        try {
            await addDoc(collection(db, 'posts'), {
                title, content, category,
                author: currentUser.uid,
                authorName: currentUserInfo?.nickname || currentUser.email,
                createdAt: new Date(),
                replies: []
            });
            newPostModal.classList.remove('active');
            postTitle.value = ''; postContent.value = '';
            renderPosts(searchInput.value, categorySelect.value);
        } catch(e) { alert('發佈失敗'); }
    });

    submitFanTranslation.addEventListener('click', async function() {
        if (!currentUser) return alert('請先登入');
        const title = fanTitle.value.trim();
        const chapter = fanChapter.value.trim();
        const content = fanContent.value.trim();
        const category = fanCategory.value;
        if (!title || !content) return alert('作品名稱和翻譯內容都不能空');
        try {
            const fullContent = `【${title}】${chapter ? ` (${chapter})` : ''}\n\n${content}`;
            await addDoc(collection(db, 'posts'), {
                title: `[漢化] ${title}`,
                content: fullContent,
                category: category,
                author: currentUser.uid,
                authorName: currentUserInfo?.nickname || currentUser.email,
                createdAt: new Date(),
                replies: []
            });
            fanTranslationModal.classList.remove('active');
            fanTitle.value = ''; fanChapter.value = ''; fanContent.value = '';
            renderPosts(searchInput.value, categorySelect.value);
        } catch(e) { alert('提交失敗'); }
    });

    searchInput.addEventListener('input', function() {
        renderPosts(this.value, categorySelect.value);
        if (this.value === '原神牛逼') showPaimon();
    });
    categorySelect.addEventListener('change', function() {
        renderPosts(searchInput.value, this.value);
    });

    let paimonShowing = false;
    function showPaimon() {
        if (paimonShowing) return;
        paimonShowing = true;
        const overlay = document.createElement('div');
        overlay.id = 'paimon-overlay';
        const canvas = document.createElement('canvas');
        canvas.width = 300; canvas.height = 300;
        overlay.appendChild(canvas);
        document.body.appendChild(overlay);
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = 'paimon.png';
        img.onload = function() {
            let startTime = Date.now();
            function animate() {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed >= 3) { overlay.remove(); paimonShowing = false; return; }
                const angle = (elapsed / 3) * Math.PI * 2;
                const bounce = Math.sin(elapsed * 6) * 20;
                ctx.clearRect(0, 0, 300, 300);
                ctx.save();
                ctx.translate(150, 150 + bounce);
                ctx.rotate(angle);
                ctx.translate(-150, -150);
                ctx.drawImage(img, 75, 75, 150, 150);
                ctx.restore();
                requestAnimationFrame(animate);
            }
            animate();
        };
        img.onerror = function() {
            overlay.remove();
            paimonShowing = false;
            alert('派蒙圖片加載失敗，請確保 paimon.png 存在');
        };
    }

    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            try {
                const docRef = doc(db, 'users', user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentUserInfo = docSnap.data();
                } else {
                    currentUserInfo = { nickname: user.email.split('@')[0] };
                }
                updateUserUI(user, currentUserInfo);
            } catch(e) {
                currentUserInfo = { nickname: user.email.split('@')[0] };
                updateUserUI(user, currentUserInfo);
            }
            renderPosts(searchInput.value, categorySelect.value);
        } else {
            currentUserInfo = null;
            updateUserUI(null, null);
            renderPosts(searchInput.value, categorySelect.value);
        }
    });

    authBtn.addEventListener('click', () => {
        isLogin = true;
        authTitle.textContent = '登入';
        submitAuth.textContent = '登入';
        authToggleText.textContent = '還沒有帳號？';
        authToggleLink.textContent = '註冊';
        nicknameGroup.style.display = 'none';
        authNickname.value = '';
        authModal.classList.add('active');
        authEmail.value = ''; authPassword.value = '';
    });

    closeAuth.addEventListener('click', () => authModal.classList.remove('active'));
    authModal.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) authModal.classList.remove('active');
    });

    authToggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        if (isLogin) {
            authTitle.textContent = '登入';
            submitAuth.textContent = '登入';
            authToggleText.textContent = '還沒有帳號？';
            authToggleLink.textContent = '註冊';
            nicknameGroup.style.display = 'none';
        } else {
            authTitle.textContent = '註冊';
            submitAuth.textContent = '註冊';
            authToggleText.textContent = '已有帳號？';
            authToggleLink.textContent = '登入';
            nicknameGroup.style.display = 'block';
        }
    });

    submitAuth.addEventListener('click', async function() {
        const email = authEmail.value.trim();
        const password = authPassword.value.trim();
        const nickname = authNickname.value.trim();
        if (!email || !password) return alert('請填寫完整');
        if (!isLogin && !nickname) return alert('註冊時請填寫暱稱');
        try {
            let userCredential;
            if (isLogin) {
                userCredential = await signInWithEmailAndPassword(auth, email, password);
            } else {
                userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    nickname: nickname,
                    email: email,
                    createdAt: new Date()
                });
                await updateProfile(userCredential.user, { displayName: nickname });
            }
            authModal.classList.remove('active');
        } catch(error) {
            alert(error.message);
        }
    });

    logoutBtn.addEventListener('click', async () => {
        await signOut(auth);
    });

    uploadAvatarBtn.addEventListener('click', () => {
        avatarFileInput.click();
    });

    avatarFileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (!currentUser) return alert('請先登入');
        try {
            const storageRef = ref(storage, `avatars/${currentUser.uid}`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);
            await setDoc(doc(db, 'users', currentUser.uid), { avatarUrl: url }, { merge: true });
            currentUserInfo.avatarUrl = url;
            updateUserUI(currentUser, currentUserInfo);
            alert('頭像更新成功！');
        } catch(error) {
            alert('上傳失敗：'+error.message);
        }
        avatarFileInput.value = '';
    });

    async function loadSticker() {
        try {
            const docRef = doc(db, 'siteConfig', 'sticker');
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.url) {
                    stickerImage.src = data.url;
                    stickerImage.style.display = 'block';
                    stickerPlaceholder.style.display = 'none';
                } else {
                    stickerImage.style.display = 'none';
                    stickerPlaceholder.style.display = 'block';
                }
            }
        } catch(e) { console.error('加载贴图失败', e); }
    }
    loadSticker();

    stickerAdminBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!currentUser) return alert('請先登入');
        if (currentUser.uid !== OWNER_UID) {
            alert('只有站長可以更換貼圖');
            return;
        }
        stickerAdminModal.classList.add('active');
        stickerUrlInput.value = '';
        stickerFileInput.value = '';
    });

    closeStickerAdmin.addEventListener('click', () => stickerAdminModal.classList.remove('active'));
    stickerAdminModal.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) stickerAdminModal.classList.remove('active');
    });

    saveStickerBtn.addEventListener('click', async function() {
        if (!currentUser || currentUser.uid !== OWNER_UID) return alert('你不是站長');
        let url = stickerUrlInput.value.trim();
        if (stickerFileInput.files.length > 0) {
            const file = stickerFileInput.files[0];
            try {
                const storageRef = ref(storage, `stickers/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                url = await getDownloadURL(storageRef);
            } catch(e) {
                alert('上傳失敗');
                return;
            }
        }
        if (!url) return alert('請輸入網址或選擇圖片');
        try {
            await setDoc(doc(db, 'siteConfig', 'sticker'), { url: url, updatedAt: new Date() });
            stickerImage.src = url;
            stickerImage.style.display = 'block';
            stickerPlaceholder.style.display = 'none';
            stickerAdminModal.classList.remove('active');
            alert('貼圖已更新！');
        } catch(e) {
            alert('儲存失敗');
        }
    });

    document.getElementById('menuForumPost').addEventListener('click', function(e) {
        e.preventDefault();
        if (!currentUser) return alert('請先登入');
        newPostModal.classList.add('active');
        postTitle.value = ''; postContent.value = '';
    });
    document.getElementById('menuFanTranslation').addEventListener('click', function(e) {
        e.preventDefault();
        if (!currentUser) return alert('請先登入');
        fanTranslationModal.classList.add('active');
        fanTitle.value = ''; fanChapter.value = ''; fanContent.value = '';
    });

    closeNewPost.addEventListener('click', () => newPostModal.classList.remove('active'));
    newPostModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) newPostModal.classList.remove('active'); });
    closeFanTranslation.addEventListener('click', () => fanTranslationModal.classList.remove('active'));
    fanTranslationModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) fanTranslationModal.classList.remove('active'); });
    closeDetail.addEventListener('click', () => detailModal.classList.remove('active'));
    detailModal.addEventListener('click', (e) => { if (e.target === e.currentTarget) detailModal.classList.remove('active'); });

    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const color = this.dataset.color;
            document.body.className = document.body.className.split(' ').filter(cls => !cls.startsWith('bg-')).join(' ');
            if (color !== 'white') document.body.classList.add('bg-' + color);
            colorBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            localStorage.setItem('forumBgColor', color);
        });
    });
    const savedBg = localStorage.getItem('forumBgColor');
    if (savedBg && savedBg !== 'white') {
        document.body.classList.add('bg-' + savedBg);
        document.querySelector(`.color-btn[data-color="${savedBg}"]`)?.classList.add('active');
    } else {
        document.querySelector('.color-btn[data-color="white"]')?.classList.add('active');
    }

    renderPosts();
</script>
</body>
