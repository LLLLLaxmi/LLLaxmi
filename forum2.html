<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兰书小说同人网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
            background: #f7f3ee;
            color: #2c2c2c;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            transition: background 0.3s, color 0.3s;
        }
        header {
            text-align: center;
            padding: 30px 0 10px;
            border-bottom: 2px solid #d6c9c0;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #4a3f3a;
        }
        header p {
            color: #7a6f68;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.5);
            padding: 10px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar-left span {
            color: #7a6f68;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border-radius: 30px;
            padding: 4px 12px;
            border: 1px solid #d6c9c0;
        }
        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            padding: 6px 0;
            font-size: 0.95rem;
            width: 140px;
            font-family: inherit;
        }
        .search-box input::placeholder {
            color: #b8a69a;
        }
        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .color-btn:hover {
            transform: scale(1.1);
            border-color: #8a7a6e;
        }
        .color-btn.active {
            border-color: #4a3f3a;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4a3f3a;
        }
        .btn {
            background: #d6c9c0;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            color: #2c2c2c;
        }
        .btn-primary {
            background: #b8a69a;
            color: #fff;
        }
        .btn-primary:hover {
            background: #a48f82;
        }
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .post-item {
            background: #fffcf9;
            padding: 18px 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #b8a69a;
            transition: 0.15s;
        }
        .post-item:hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .post-item h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 4px;
            cursor: pointer;
            color: #3a2f2a;
        }
        .post-item h3:hover {
            color: #8a7a6e;
        }
        .post-meta {
            font-size: 0.85rem;
            color: #9a8e86;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .post-meta span {
            display: inline-block;
        }
        .post-excerpt {
            margin-top: 8px;
            color: #5a4f48;
            font-size: 0.95rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fffcf9;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 22px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #9a8e86;
            background: none;
            border: none;
        }
        .modal h2 {
            font-weight: 400;
            margin-bottom: 6px;
        }
        .modal .detail-meta {
            color: #9a8e86;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .modal .content {
            line-height: 1.8;
            margin-bottom: 24px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .reply-section {
            border-top: 1px solid #e0d6ce;
            padding-top: 18px;
            margin-top: 10px;
        }
        .reply-item {
            background: #f7f0eb;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .reply-item strong {
            color: #5a4f48;
        }
        .reply-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }
        .reply-form textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #d6c9c0;
            font-family: inherit;
            resize: vertical;
            min-height: 70px;
        }
        .reply-form button {
            align-self: flex-end;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #4a3f3a;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #d6c9c0;
            font-family: inherit;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #9a8e86;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #b8a69a;
            border-top: 1px solid #e0d6ce;
            padding-top: 20px;
        }
        /* 深色背景适配 */
        body.dark-mode {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        body.dark-mode header {
            border-bottom-color: #444;
        }
        body.dark-mode header h1,
        body.dark-mode header p {
            color: #ddd;
        }
        body.dark-mode .toolbar {
            background: rgba(40,40,40,0.8);
        }
        body.dark-mode .toolbar-left span {
            color: #aaa;
        }
        body.dark-mode .search-box {
            background: #2a2a2a;
            border-color: #555;
        }
        body.dark-mode .search-box input {
            color: #ddd;
        }
        body.dark-mode .search-box input::placeholder {
            color: #777;
        }
        body.dark-mode .post-item {
            background: #2a2a2a;
            border-left-color: #888;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        body.dark-mode .post-item h3 {
            color: #eee;
        }
        body.dark-mode .post-item h3:hover {
            color: #b8a69a;
        }
        body.dark-mode .post-meta,
        body.dark-mode .post-excerpt {
            color: #bbb;
        }
        body.dark-mode .modal {
            background: #2a2a2a;
            color: #eee;
        }
        body.dark-mode .modal-close {
            color: #aaa;
        }
        body.dark-mode .modal .detail-meta {
            color: #aaa;
        }
        body.dark-mode .reply-item {
            background: #333;
        }
        body.dark-mode .reply-item strong {
            color: #ccc;
        }
        body.dark-mode .reply-form textarea {
            background: #222;
            border-color: #555;
            color: #ddd;
        }
        body.dark-mode .form-group label {
            color: #ccc;
        }
        body.dark-mode .form-group input,
        body.dark-mode .form-group textarea {
            background: #222;
            border-color: #555;
            color: #ddd;
        }
        body.dark-mode .btn {
            background: #444;
            color: #ddd;
        }
        body.dark-mode .btn-primary {
            background: #666;
            color: #fff;
        }
        body.dark-mode .btn-primary:hover {
            background: #888;
        }
        body.dark-mode .footer {
            border-top-color: #444;
            color: #777;
        }
        body.dark-mode .empty-state {
            color: #aaa;
        }
        /* 白色背景额外适配（让卡片有点阴影） */
        body.white-mode .post-item {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        @media (max-width: 600px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .search-box input {
                width: 100%;
            }
            .color-picker {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>📖 兰书小说同人网</h1>
    <p>聊聊那些我們讀過的故事</p>
</header>

<div class="toolbar">
    <div class="toolbar-left">
        <span>📚 全部帖子 · 最新</span>
        <div class="search-box">

        <div class="color-picker" id="colorPicker">
            <button class="color-btn" style="background:#e8f5e9;" data-color="green" title="綠"></button>
            <button class="color-btn" style="background:#efebe9;" data-color="brown" title="棕"></button>
            <button class="color-btn" style="background:#1a1a1a;" data-color="black" title="黑"></button>
            <button class="color-btn" style="background:#ffffff; border-color:#ccc;" data-color="white" title="白"></button>
            <button class="color-btn" style="background:#e3f2fd;" data-color="blue" title="藍"></button>
        </div>
        <button class="btn btn-primary" id="newPostBtn">＋ 發新帖</button>
    </div>
</div>

<div id="postList" class="post-list">
    <!-- 动态渲染 -->
</div>

<!-- 新帖弹窗 -->
<div class="modal-overlay" id="newPostModal">
    <div class="modal">
